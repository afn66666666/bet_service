syntax = "proto3";

package login.v1;

option go_package = "load_service/proto/login/v1;loginv1";

service LoginService{
rpc Login (LoginRequest)
    returns (LoginResponse);
}

message LoginRequest{
    string email = 1;
    string password = 2;
}

message LoginResponse{
   int64 user_id = 1;
     string access_token = 2;
}


